# Public single-clip prior hyperparameters, with the G1 skeleton/motion.
model_name: "tiny_mdm"
arch_name: "DiT"
T: 50
loss_type: "l1"
estimate_mode: "epsilon"
noise_schedule_mode: "squaredcos_cap_v2"
num_layers: 2
num_attention_heads: 4
model_ema: True
model_ema_decay: 0.995
model_ema_steps: 10
model_ema_update_after: 5000
normalizer_std_clip: 0.2
batch_size: 512
lr: 0.0001
num_iterations: 50000
num_samples_stat: 10000
output_iter: 2000
grad_clip_norm: 1.0
env_config: "data/envs/smp_spinkick_g1_env.yaml"
motion_file: "output/g1_spinkick_assets/g1_spinkick_joint_limited.pkl"
control_freq: 30
master_port: "11435"
